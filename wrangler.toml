name = "jobseeker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Workers Free plan only. Nothing in this app uses a paid Cloudflare service.

[[d1_databases]]
binding = "DB"
database_name = "jobseeker-db"
database_id = "bfde5052-b5ea-42d2-9fce-6cde4978c769"
migrations_dir = "migrations"

# Worker Previews (non-main branches, built by Workers Builds) use a separate
# staging D1 database with the same migrations applied, never production data.
[[previews.d1_databases]]
binding = "DB"
database_name = "jobseeker-preview-db"
database_id = "74b8b710-14d3-41e5-b4d3-f1638e0bc190"
migrations_dir = "migrations"

# Every 15 minutes: push notifications (agent status changes, interview
# reminders, morning digest) and the daily NBS rate refresh. One trigger only,
# to stay well inside the Workers Free cron allowance.
[triggers]
crons = ["*/15 * * * *"]

# Workers AI: Whisper speech-to-text for voice-recorded STAR stories. Uses only
# the free daily allocation (10,000 neurons, ~200 minutes of audio); on the Free
# plan it simply stops for the day past that, it never bills.
[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"

# No secrets needed: sessions are random 256-bit tokens stored in D1.
